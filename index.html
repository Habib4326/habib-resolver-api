        let currentPage = 1;
        const itemsPerPage = 10;

        const playerContainer = document.getElementById('playerContainer');
        const currentMovieTitle = document.getElementById('currentMovieTitle');
        const playlistGrid = document.getElementById('playlistGrid');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageIndicator = document.getElementById('pageIndicator');

        function renderMovies() {
            playlistGrid.innerHTML = '';
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageMovies = movies.slice(startIndex, endIndex);

            pageMovies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => playMovie(movie.title, movie.url, movie.poster);
                card.innerHTML = `
                    <div class="thumbnail-box">
                        <img src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/300x400?text=No+Poster'">
                    </div>
                    <div class="card-details">
                        <div class="card-title">${movie.title}</div>
                        <div class="card-sub">${movie.sub}</div>
                    </div>
                `;
                playlistGrid.appendChild(card);
            });

            const totalPages = Math.ceil(movies.length / itemsPerPage) || 1;
            pageIndicator.innerText = `Page ${currentPage} of ${totalPages}`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        }

        function changePage(direction) {
            currentPage += direction;
            renderMovies();
        }

        function playMovie(title, videoUrl, posterUrl) {
            currentMovieTitle.innerText = title;
            playerContainer.innerHTML = `
                <video id="mainVideoPlayer" controls autoplay poster="${posterUrl}">
                    <source src="${videoUrl}" type="video/x-matroska">
                </video>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function loadCustomUrl() {
            const inputUrl = document.getElementById('customUrlInput').value.trim();
            if (!inputUrl) return alert('Please enter a valid URL!');
            playMovie('Custom Stream Video', inputUrl, '');
        }

        renderMovies();
    </script>
